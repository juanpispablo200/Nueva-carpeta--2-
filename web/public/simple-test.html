<!DOCTYPE html>
<html>
<head>
    <title>Test Simple - Jagoo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .box { background: white; padding: 20px; border-radius: 10px; margin: 20px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 5px; margin: 10px 0; }
        .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Test Simple - Jagoo</h1>
    
    <div class="box">
        <h2>Test 1: Conexión a Supabase</h2>
        <button onclick="test1()">Probar Conexión</button>
        <div id="test1-result"></div>
    </div>
    
    <div class="box">
        <h2>Test 2: Columna is_active</h2>
        <button onclick="test2()">Verificar columna is_active</button>
        <div id="test2-result"></div>
    </div>
    
    <div class="box">
        <h2>Test 3: Login rápido</h2>
        <button onclick="test3()">Probar Login (admin@jagoo.com / Admin123)</button>
        <div id="test3-result"></div>
    </div>

    <script>
        const supabase = window.supabase.createClient(
            'https://tjgavwygdotetoatitju.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqZ2F2d3lnZG90ZXRvYXRpdGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NjA2ODgsImV4cCI6MjExMDQzNjY4OH0.e_xgPLnPAgJgpUCRPcusITh9V2xVkn_O8B_AKs5PtaI'
        )
        
        async function test1() {
            const r = document.getElementById('test1-result')
            r.innerHTML = 'Probando...'
            
            try {
                const { data, error } = await supabase.from('profiles').select('count')
                if (error) {
                    r.innerHTML = `<div class="error"><strong>ERROR:</strong> ${error.message}</div>`
                } else {
                    r.innerHTML = `<div class="success"><strong>ÉXITO:</strong> Conexión establecida</div>`
                }
            } catch (err) {
                r.innerHTML = `<div class="error"><strong>ERROR CRÍTICO:</strong> ${err.message}</div>`
            }
        }
        
        async function test2() {
            const r = document.getElementById('test2-result')
            r.innerHTML = 'Verificando...'
            
            try {
                const { error } = await supabase.from('profiles').select('is_active').limit(1)
                if (error) {
                    if (error.message.includes('is_active')) {
                        r.innerHTML = `<div class="error">
                            <strong>PROBLEMA IDENTIFICADO:</strong><br>
                            ${error.message}<br><br>
                            <strong>SOLUCIÓN:</strong><br>
                            1. Abre: <a href="https://supabase.com/dashboard/project/tjgavwygdotetoatitju/sql/new" target="_blank">Supabase SQL Editor</a><br>
                            2. Ejecuta este SQL:<br>
                            <code>ALTER TABLE profiles ADD COLUMN IF NOT EXISTS is_active boolean DEFAULT true;</code>
                        </div>`
                    } else {
                        r.innerHTML = `<div class="error">${error.message}</div>`
                    }
                } else {
                    r.innerHTML = `<div class="success"><strong>OK:</strong> La columna is_active existe</div>`
                }
            } catch (err) {
                r.innerHTML = `<div class="error">${err.message}</div>`
            }
        }
        
        async function test3() {
            const r = document.getElementById('test3-result')
            r.innerHTML = 'Probando login...'
            
            try {
                const { error } = await supabase.auth.signInWithPassword({
                    email: 'admin@jagoo.com',
                    password: 'Admin123'
                })
                
                if (error) {
                    r.innerHTML = `<div class="error">
                        <strong>LOGIN FALLIDO:</strong><br>
                        ${error.message}<br><br>
                        <strong>POSIBLES CAUSAS:</strong><br>
                        1. El usuario no existe<br>
                        2. La contraseña es incorrecta<br>
                        3. La cuenta no está confirmada
                    </div>`
                } else {
                    r.innerHTML = `<div class="success"><strong>LOGIN EXITOSO!</strong></div>`
                    await supabase.auth.signOut()
                }
            } catch (err) {
                r.innerHTML = `<div class="error">${err.message}</div>`
            }
        }
        
        // Ejecutar tests automáticamente
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                test1()
                setTimeout(test2, 1000)
                setTimeout(test3, 2000)
            }, 500)
        })
    </script>
</body>
</html>
