# Gradle JVM Options - Aumenta el Heap Memory a 4GB para evitar OutOfMemoryError en dexing
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=NONE -Djdk.internal.httpclient.disableHostnameVerification -Dcom.sun.jndi.ldap.object.trustURLCodebase=false -Djava.net.useSystemProxies=true -Djavax.net.ssl.trustStoreType=Windows-ROOT

# Opciones de rendimiento de Gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin Daemon JVM Options
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# AndroidX y configuraciones de compatibilidad
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
